name: paper-desk
# Forward-test (paper) of the strategies in this repo. Light job: stdlib Python, ~20-60 s per run, public market data only.
on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub may delay runs; desk.py replays every missed closed 1m bar, so delays lose nothing
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paper-desk
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Advance paper books
        run: python desk.py
      - name: Commit state
        if: always()
        run: |
          git config user.name "paper-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -q -m "desk: $(date -u +%FT%TZ) run ${GITHUB_RUN_ID}"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
